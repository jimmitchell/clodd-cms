services:

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/cms
    # Run as current host user so generated files aren't owned by root
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped

  # Scheduled posts, the same job the prod crontab runs every minute. Shares
  # the php service's uid/gid deliberately: this writes HTML into the web root,
  # and files owned by anyone else make the next web-triggered rebuild fail.
  #
  # Behind a profile, so a plain `docker compose up` leaves it out. This is not
  # tidiness: the local database is usually a copy of prod, which carries live
  # Mastodon, Bluesky and Pixelfed tokens, and publish-scheduled.php builds *and
  # syndicates* through PostPublisher. Started by accident against a prod copy
  # with something sitting in the schedule, it posts to the real accounts from a
  # laptop. Start it deliberately when testing the scheduler:
  #
  #     docker compose --profile scheduler up
  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/cms
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'while true; do
         php /var/www/cms/bin/publish-scheduled.php --quiet || true;
         sleep 60;
       done'
    depends_on:
      - php
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/cms:ro
      # Media uploads need write access for the alias to work correctly
      - ./content/media:/var/www/cms/content/media
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
